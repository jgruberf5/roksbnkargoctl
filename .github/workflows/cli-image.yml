name: cli image

# Publishes roksbnkargoctl itself as a container image, so it runs with only
# Docker (build/cli/Dockerfile). The tags follow check-image.yml: main → :dev,
# tag vX.Y.Z → :vX.Y.Z and :latest, a same-repo pull request → :pr-<number>.
# A fork pull request has no packages:write token, so it is built, not pushed:
# the Dockerfile is still proven on both architectures before it merges.
#
# Path filters do not apply to tag pushes, so every release tag builds the image
# of that version, alongside release.yml and check-image.yml.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['cmd/roksbnkargoctl/**', 'internal/**', 'build/cli/**', 'go.mod', 'go.sum', '.github/workflows/cli-image.yml']
  pull_request:
    paths: ['cmd/roksbnkargoctl/**', 'internal/**', 'build/cli/**', 'go.mod', 'go.sum', '.github/workflows/cli-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          img=ghcr.io/${{ github.repository_owner }}/roksbnkargoctl
          # VERSION is stamped into the binary. On a release it must be exactly
          # the tag: checkImageTag selects the :vX.Y.Z check image from it.
          version=dev
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            tags="${img}:pr-${PR}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            tags="${img}:${GITHUB_REF_NAME}"
            # :latest only for a final release: self update --check ignores
            # prereleases, and so should `docker pull …:latest`.
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tags="${tags},${img}:latest"
            fi
          else
            tags="${img}:dev"
          fi
          push=true
          if [[ "${FORK}" == true ]]; then push=false; fi
          {
            echo "tags=${tags}"
            echo "version=${version}"
            echo "commit=${SHA::7}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "push=${push}"
          } >> "$GITHUB_OUTPUT"
      - if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
