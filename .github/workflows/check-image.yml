name: check image

# Publishes the in-cluster check image. main → :dev, tag vX → :vX and :latest.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['cmd/check/**', 'build/check/**', 'go.mod', '.github/workflows/check-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          img=ghcr.io/${{ github.repository_owner }}/roksbnkargoctl-check
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${img}:${GITHUB_REF_NAME},${img}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${img}:dev" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/check/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
