name: check image

# Publishes the in-cluster check image. main → :dev, tag vX → :vX and :latest,
# and a same-repo pull request → :pr-<number>, so a check change can be proven on
# a live cluster (check.image: …:pr-N) BEFORE it merges, not after.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['cmd/check/**', 'internal/singlecert/**', 'build/check/**', 'go.mod', '.github/workflows/check-image.yml']
  pull_request:
    paths: ['cmd/check/**', 'internal/singlecert/**', 'build/check/**', 'go.mod', '.github/workflows/check-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Fork PRs get no packages:write token; they are built by CI only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          img=ghcr.io/${{ github.repository_owner }}/roksbnkargoctl-check
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            echo "tags=${img}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "version=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${img}:${GITHUB_REF_NAME},${img}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${img}:dev" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/check/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
